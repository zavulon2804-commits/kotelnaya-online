<style>html{-webkit-text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<style>
/* Layout: инструментальная панель сверху, слева библиотека узлов, в центре лист чертежа (как формат А3 со штампом), справа свойства и спецификация. */
:root{

<style>
/* Layout: инструментальная панель сверху, слева библиотека узлов, в центре лист чертежа (как формат А3 со штампом), справа свойства и спецификация. */
:root{
  --bg:#EDF1F2; --panel:#FFFFFF; --line:#D3DBDE; --fg:#17222A; --muted:#566872;
  --accent:#A8731A; --accent-soft:#F4E7CF; --accent-fg:#FFFFFF; --sel:#0B7A84;
  --sheet:#FFFFFF; --sheet-ink:#1D2733; --sheet-grid:#E6ECEF;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-display:"Unbounded","Golos Text",system-ui,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161A; --panel:#172026; --line:#2A3740; --fg:#E2E9EC; --muted:#93A4AD;
  --accent:#D8A444; --accent-soft:#3A2F1C; --accent-fg:#1A1206; --sel:#41C2CA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161A; --panel:#172026; --line:#2A3740; --fg:#E2E9EC; --muted:#93A4AD;
  --accent:#D8A444; --accent-soft:#3A2F1C; --accent-fg:#1A1206; --sel:#41C2CA; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--f-display);font-size:19px;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.logo{width:36px;height:36px;flex:none}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px;margin-bottom:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.warn{border-color:#C0392B;color:#C0392B}
.pipes{display:flex;flex-wrap:wrap;gap:6px}
.pipe-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px 5px 6px;font-size:13px}
.pipe-chip i{width:22px;height:6px;border-radius:3px;display:block}
.pipe-chip[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);font-weight:600}
.spacer{flex:1}
.hint{font-size:12.5px;color:var(--muted)}

.app{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:12px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:8px}
.lib{max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:8px}
.lib-group{margin-bottom:12px}
.lib-group h3{font-size:12px;color:var(--muted);font-weight:500;margin:6px 0}
.lib-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tile{min-width:0;overflow-wrap:anywhere;hyphens:auto;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:6px 4px;font-size:11.5px;line-height:1.2;text-align:center;min-height:84px}
.tile svg{width:46px;height:42px}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile:hover{border-color:var(--muted)}

.stage{min-width:0}
.canvas-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 150px)}
#sheet{display:block;touch-action:pan-x pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
#sheet .it,#sheet .pp{touch-action:none;cursor:move}
#sheet.mode-pipe,#sheet.mode-place{cursor:crosshair}
#sheet.mode-pipe .it{cursor:crosshair}
.stage-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.zoom{display:flex;gap:4px;align-items:center}
.zoom span{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}

.side{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:6px 8px;width:100%;min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:13px}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec td{border-top:1px solid var(--line);padding:4px 2px;vertical-align:middle}
.spec td:first-child{width:34px}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#FFD400;color:#111;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;border:1.5px solid #111}
.spec input{border:0;background:transparent;width:100%;padding:2px 0}
.spec input:focus{background:var(--bg)}
.spec .sm{color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(10,15,18,.55);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-box{background:var(--panel);color:var(--fg);border-radius:12px;max-width:min(1000px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.modal-box img{border:1px solid var(--line);border-radius:6px;background:#fff}
.modal-box textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60;font-size:13px}

@media (max-width:1100px){.app{grid-template-columns:180px minmax(0,1fr)}.side{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lib{position:static;max-height:none;order:2}
  .stage{order:1}.side{order:3}
  .lib-grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
  .canvas-wrap{max-height:65vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tpl{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.tpl:hover{border-color:var(--accent)}
.tpl svg{width:100%;height:auto;background:#fff;border-radius:6px;border:1px solid var(--line)}
.tpl b{font-size:13.5px;line-height:1.3}.tpl span{font-size:12px;color:var(--muted);line-height:1.35}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@keyframes flow{to{stroke-dashoffset:-36}}
#sheet .flow{animation:flow 1.1s linear infinite}
#sheet .vh,#sheet .sh{cursor:grab}
#sheet .port{cursor:crosshair}
@media (prefers-reduced-motion:reduce){#sheet .flow{animation:none}}
</style>
</head>
<body>


<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 36 36" aria-hidden="true"><rect x="1" y="1" width="34" height="34" rx="8" fill="var(--fg)"/><path d="M9 26V12h6v14M21 26V10h6v16" stroke="var(--bg)" stroke-width="2.5" fill="none"/><path d="M15 15h6M15 22h6" stroke="#E0453A" stroke-width="2.5"/></svg>
    <div><h1>Конструктор котельной</h1><small>Схема обвязки, номера узлов для наклеек и спецификация на одном листе</small></div>
  </div>
</header>

<div class="toolbar" role="toolbar" aria-label="Инструменты">

  <button class="btn" id="tplBtn">Шаблоны</button>

</div>

<div class="app">

  <aside class="side">

    <div class="panel"><h2>Спецификация</h2><table class="spec"><tbody id="spec"></tbody></table></div>
  </aside>
</div>

<div class="modal" id="modal" hidden><div class="modal-box" id="modalBox"></div></div>

<script>

const GROUPS=["Котлы","Ёмкости","Распределение","Приборы","Арматура","Контроль","Водоподготовка","Прочее"];
const DV={l:[-1,0],r:[1,0],t:[0,-1],b:[0,1]};
const ROT={l:{90:"t",180:"r",270:"b"},r:{90:"b",180:"l",270:"t"},t:{90:"r",180:"b",270:"l"},b:{90:"l",180:"t",270:"r"}};

/* ---------- геометрия ---------- */
const snap=v=>Math.round(v/G)*G;
const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
function portAbs(o,pid){const D=DEFS[o.type];const p=D&&D.ports.find(q=>q.id===pid);if(!p)return null;const cx=D.w/2,cy=D.h/2,dx=p.x-cx,dy=p.y-cy,r=((o.rot||0)%360+360)%360;
  let x=dx,y=dy;if(r===90){x=-dy;y=dx}else if(r===180){x=-dx;y=-dy}else if(r===270){x=dy;y=-dx}
  return {pos:[Math.round(o.x+cx+x),Math.round(o.y+cy+y)],d:r?ROT[p.d][r]:p.d}}
function clean(pts){const out=[];pts.forEach(p=>{if(!same(out[out.length-1],p))out.push([p[0],p[1]])});
  for(let i=out.length-2;i>0;i--){const a=out[i-1],b=out[i],c=out[i+1];if((a[0]===b[0]&&b[0]===c[0])||(a[1]===b[1]&&b[1]===c[1]))out.splice(i,1)}return out}
function ortho(pts,firstVert){const out=[pts[0]];let prevH=firstVert===undefined?null:!firstVert;
  for(let i=1;i<pts.length;i++){const a=out[out.length-1],b=pts[i];
    if(a[0]!==b[0]&&a[1]!==b[1]){const c=prevH===true?[a[0],b[1]]:[b[0],a[1]];out.push(c);prevH=c[1]===b[1]}
    else prevH=a[1]===b[1];out.push(b)}return out}
function route(a,da,b,db){const L=20;
  const A1=da?[a[0]+DV[da][0]*L,a[1]+DV[da][1]*L]:a, B1=db?[b[0]+DV[db][0]*L,b[1]+DV[db][1]*L]:b;
  const hA=da==="l"||da==="r", hB=db==="l"||db==="r";let mid;
  if(da&&db&&hA&&hB){const m=snap((A1[0]+B1[0])/2);mid=[[m,A1[1]],[m,B1[1]]]}
  else if(da&&db&&!hA&&!hB){const m=snap((A1[1]+B1[1])/2);mid=[[A1[0],m],[B1[0],m]]}
  else if(da&&hA)mid=[[B1[0],A1[1]]];
  else if(da)mid=[[A1[0],B1[1]]];
  else if(db&&hB)mid=[[a[0],B1[1]]];
  else mid=[[B1[0],a[1]]];
  return clean(ortho([a,A1,...mid,B1,b],da?!hA:undefined))}

/* ---------- шаблоны ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
function Builder(meta){
  const st={meta:Object.assign({obj:"",addr:"",inst:"",phone:"",date:""},meta||{}),items:[],pipes:[]};const K={};let n=0;
  const B={st,
    add(key,type,x,y,label,note,rot){const D=DEFS[type];const o={id:key||uid(),type,x,y,rot:rot||0,n:D.nonum?0:++n,label:label||D.n,note:note||""};st.items.push(o);if(key)K[key]=o;return B},
    text(x,y,t){st.items.push({id:uid(),type:"text",x,y,rot:0,n:0,label:t,note:""});return B},
    val(x,y,t){st.items.push({id:uid(),type:"value",x,y,rot:0,n:0,label:t,note:""});return B},
    end(ref){if(Array.isArray(ref))return{pos:ref,d:null,att:null};const[k,p]=ref.split(".");const pa=portAbs(K[k],p);if(!pa)throw new Error("port "+ref);return{pos:pa.pos,d:pa.d,att:{item:K[k].id,port:p}}},
    pipe(kind,from,to,via){const A=B.end(from),Z=B.end(to);let pts;
      if(via){pts=clean(ortho([A.pos,...via,Z.pos],A.d?!(A.d==="l"||A.d==="r"):undefined))}else pts=route(A.pos,A.d,Z.pos,Z.d);
      st.pipes.push({id:uid(),kind,pts,a:A.att,b:Z.att,auto:!via});return B}};
  return B}

/* общий блок: коллектор + гидрострелка/буфер + насосные группы */
function hub(b,hubType,groups){
  b.add("M","manifold",380,330,"Коллектор отопления");
  if(hubType==="buffer")b.add("H","buffer",660,310,"Буферная ёмкость");else b.add("H","hydro",660,320,"Гидрострелка");
  b.pipe("sup","M.in_s","H.l1").pipe("ret","M.in_r","H.l2");
  groups.forEach((g,i)=>{const k="G"+i;b.add(k,g.type,380+60*i,390,g.label,g.note||"");b.pipe("sup","M.s"+i,k+".is").pipe("ret","M.r"+i,k+".ir")});
  return b}
function dhwTank(b,gi){ // бойлер слева вверху от группы gi
  const gx=380+60*gi;b.add("T","tank_ind",80,120,"Бойлер косвенного нагрева");
  b.pipe("sup","G"+gi+".os","T.cs",[[gx+20,510],[220,510],[220,180]]);
  b.pipe("ret","G"+gi+".or","T.cr",[[gx+40,530],[200,530],[200,240]]);
  b.add("EXD","exp_dhw",20,640,"Расширительный бак ГВС");
  b.pipe("cw",[1060,900],"T.cw",[[120,900]]).pipe("cw",[120,620],"EXD.p",[[40,620]]);
  b.pipe("hw","T.hw",[1060,50],[[120,50]]);b.text(900,30,"К потребителям ГВС →").text(940,920,"Ввод ХВС ←");
  b.add("VIN","valve",980,890,"Кран на вводе воды").add("FIN","filter_f",900,890,"Фильтр на вводе ХВС");return b}
function ufLeft(b,gi,y){const gx=380+60*gi;b.add("UF","uf_man",gx-180,y,"Коллектор тёплого пола");b.pipe("ufs","G"+gi+".os","UF.s2").pipe("ufr","G"+gi+".or","UF.r2");return b}
function radLeft(b,gi,y,key,label){const gx=380+60*gi;b.add(key,"rad",gx-120,y,label);b.pipe("sup","G"+gi+".os",key+".s2").pipe("ret","G"+gi+".or",key+".r2");return b}

function itemSVG(o,isSel){const D=DEFS[o.type];if(!D)return"";const cx=D.w/2,cy=D.h/2;let inner;
  if(o.type==="text")inner=`<rect x="0" y="0" width="${D.w}" height="${D.h}" fill="transparent"/><text x="0" y="15" font-size="14" font-family="Arial" font-weight="bold" fill="${INK}">${esc(o.label)}</text>`;
  else if(o.type==="value")inner=`<rect x="0" y="0" width="${D.w}" height="${D.h}" rx="5" fill="${INK}"/><text x="${D.w/2}" y="16.5" font-size="13" font-family="Arial" font-weight="bold" text-anchor="middle" fill="#7CF3A0">${esc(o.label)}</text>`;

  const tag=D.nonum?"":`<g transform="translate(-6 -6)"><circle r="11" fill="#FFD400" stroke="#111" stroke-width="1.6"/><text y="4.5" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#111">${o.n}</text></g>`;
  const box=isSel?`<rect x="-6" y="-6" width="${D.w+12}" height="${D.h+12}" fill="none" stroke="#0B7A84" stroke-width="2" stroke-dasharray="5 4" rx="4"/>`:"";

function portsSVG(s,o){let out="";const conn=new Set();s.pipes.forEach(p=>{if(p.a)conn.add(p.a.item+"/"+p.a.port);if(p.b)conn.add(p.b.item+"/"+p.b.port)});

    if(!draft){if(hp){draft={pts:[attPos(hp).pos],a:hp}}else draft={pts:[[snap(x),snap(y)]],a:null};$("finishPipe").hidden=false;render();return}
    if(hp){finishDraft(false,hp);return}
    const P=[snap(x),snap(y)];const L=draft.pts[draft.pts.length-1];draft.pts.push([P[0],L[1]],P);render();return}
  const p0=sel&&st.pipes.find(q=>q.id===sel);
  const vh=e.target.closest(".vh"),sh=e.target.closest(".sh");
  if(p0&&(vh||sh)){drag={pipe:p0,orig:p0.pts.map(q=>q.slice()),vi:vh?+vh.dataset.i:null,sk:sh?+sh.dataset.k:null,moved:false,start:[x,y]};svg.setPointerCapture(e.pointerId);e.preventDefault();return}
  const g=e.target.closest(".it,.pp");
  if(!g){sel=null;renderAll();return}
  if(g.classList.contains("pp")){sel=g.dataset.pid;renderAll();return}
  const o=itemById(g.dataset.id);if(!o)return;sel=o.id;
  drag={o,dx:x-o.x,dy:y-o.y,moved:false};svg.setPointerCapture(e.pointerId);e.preventDefault();render();renderInsp()});

function dragVertex(orig,i,P){const pts=orig.map(q=>q.slice()),last=pts.length-1,old=pts[i];
  if(i===0||i===last){const j=i===0?1:last-1;if(pts.length>2){const N=pts[j];if(N[0]===old[0]&&N[1]!==old[1])N[0]=P[0];else N[1]=P[1]}pts[i]=P;return i===0?ortho(pts.reverse()).reverse():ortho(pts)}
  const ins=[];
  [i-1,i+1].forEach(j=>{const N=pts[j];const wasH=N[1]===old[1];const isEnd=j===0||j===last;
    if(isEnd)ins.push({j,c:wasH?[P[0],N[1]]:[N[0],P[1]]});else{if(wasH)N[1]=P[1];else N[0]=P[0]}});
  pts[i]=P;
  ins.sort((a,b)=>b.j-a.j).forEach(({j,c})=>{if(same(c,P)||same(c,pts[j]))return;pts.splice(j>i?i+1:i,0,c)});
  return pts}
function dragSeg(orig,k,P){let pts=orig.map(q=>q.slice());const h=pts[k][1]===pts[k+1][1];let i=k,j=k+1;
  if(i===0){pts.splice(1,0,pts[0].slice());i=1;j=2}
  if(j===pts.length-1){pts.splice(j,0,pts[j].slice())}
  if(h){pts[i][1]=P[1];pts[j][1]=P[1]}else{pts[i][0]=P[0];pts[j][0]=P[0]}return pts}

svg.addEventListener("pointermove",e=>{
  const[x,y]=pt(e);
  if(mode==="pipe"){const hp=nearestPort(x,y);const ch=JSON.stringify(hp)!==JSON.stringify(hoverPort);hoverPort=hp;if(draft){cursor=[snap(x),snap(y)];render()}else if(ch)render();return}
  if(!drag)return;
  if(drag.pipe){const P=[snap(x),snap(y)];if(!drag.moved){if(Math.hypot(x-drag.start[0],y-drag.start[1])<3)return;push();drag.moved=true}
    const p=drag.pipe,last=drag.orig.length-1;
    if(drag.vi!==null){p.pts=dragVertex(drag.orig,drag.vi,P);if(drag.vi===0)p.a=null;if(drag.vi===last)p.b=null;
      if(drag.vi===0||drag.vi===last){hoverPort=nearestPort(x,y)}}
    else p.pts=dragSeg(drag.orig,drag.sk,P);
    p.auto=false;render();return}
  const nx=snap(x-drag.dx),ny=snap(y-drag.dy);
  if(nx!==drag.o.x||ny!==drag.o.y){if(!drag.moved){push();drag.moved=true}drag.o.x=Math.max(0,Math.min(DRAW_R-20,nx));drag.o.y=Math.max(0,Math.min(H-30,ny));updateAttached(drag.o);render()}});
svg.addEventListener("pointerup",()=>{if(!drag)return;
  if(drag.pipe&&drag.moved){const p=drag.pipe,last=drag.orig.length-1;
    if((drag.vi===0||drag.vi===last)&&hoverPort){const end=drag.vi===0?"a":"b";const pa=attPos(hoverPort);moveEnd(p,end,pa.pos);p[end]=hoverPort}
    p.pts=clean(p.pts);hoverPort=null}
  drag=null;renderAll()});
svg.addEventListener("pointercancel",()=>{drag=null});
svg.addEventListener("dblclick",e=>{
  if(mode==="pipe"){e.preventDefault();finishDraft();return}
  const p=sel&&st.pipes.find(q=>q.id===sel);if(!p)return;const[x,y]=pt(e);
  const vh=e.target.closest(".vh");
  if(vh){const i=+vh.dataset.i;if(i===0||i===p.pts.length-1)return;push();const pts=p.pts.slice();pts.splice(i,1);p.pts=clean(ortho(pts));p.auto=false;renderAll();return}
  // добавить изгиб: делим участок на три части
  let best=-1,bd=12;for(let k=0;k<p.pts.length-1;k++){const a=p.pts[k],b=p.pts[k+1];const h=a[1]===b[1];const lo=h?Math.min(a[0],b[0]):Math.min(a[1],b[1]),hi=h?Math.max(a[0],b[0]):Math.max(a[1],b[1]);const along=h?x:y,off=h?Math.abs(y-a[1]):Math.abs(x-a[0]);if(along>=lo&&along<=hi&&off<bd){bd=off;best=k}}
  if(best<0)return;push();const a=p.pts[best],b=p.pts[best+1];const h=a[1]===b[1];const len=h?b[0]-a[0]:b[1]-a[1];
  const c1=h?[snap(a[0]+len/3),a[1]]:[a[0],snap(a[1]+len/3)],c2=h?[snap(a[0]+2*len/3),a[1]]:[a[0],snap(a[1]+2*len/3)];
  p.pts.splice(best+1,0,c1,c2);p.auto=false;render();toast("Добавлены две точки изгиба: потяните средний участок")});
$("finishPipe").onclick=()=>finishDraft();

document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea"||tag==="select")return;
  if(!$("modal").hidden){if(e.key==="Escape")closeModal();return}
  const o=sel&&itemById(sel);
  if(e.key==="Escape"){if(draft){draft=null;cursor=null;$("finishPipe").hidden=true;render()}else if(placing){placing=null;updateLibPressed();hint(null)}else if(mode==="pipe")setMode("select");else{sel=null;renderAll()}}
  else if(e.key==="Enter"&&draft)finishDraft();
  else if((e.key==="Delete"||e.key==="Backspace")&&sel){delSel();e.preventDefault()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){doUndo();e.preventDefault()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="d"&&o){dupSel();e.preventDefault()}
  else if(e.key.toLowerCase()==="r"&&!e.ctrlKey&&!e.metaKey&&o)rotSel();
  else if(o&&e.key.startsWith("Arrow")){const d={ArrowLeft:[-G,0],ArrowRight:[G,0],ArrowUp:[0,-G],ArrowDown:[0,G]}[e.key];push();o.x+=d[0];o.y+=d[1];updateAttached(o);renderAll();e.preventDefault()}});

function nextNum(){return st.items.reduce((m,o)=>Math.max(m,o.n||0),0)+1}
function delSel(){if(!sel)return;push();st.items=st.items.filter(o=>o.id!==sel);st.pipes=st.pipes.filter(p=>p.id!==sel);st.pipes.forEach(p=>{if(p.a&&p.a.item===sel)p.a=null;if(p.b&&p.b.item===sel)p.b=null});sel=null;renderAll()}
function rotSel(){const o=itemById(sel);if(!o||DEFS[o.type].nonum)return;push();o.rot=((o.rot||0)+90)%360;updateAttached(o);renderAll()}
function dupSel(){const o=itemById(sel);if(!o)return;push();const c={...o,id:uid(),x:o.x+20,y:o.y+20,n:DEFS[o.type].nonum?0:nextNum()};st.items.push(c);sel=c.id;renderAll()}
function doUndo(){const s=undoStack.pop();if(!s){toast("Отменять больше нечего");return}st=JSON.parse(s);sel=null;draft=null;renderAll()}

/* ---------- свойства ---------- */
function renderInsp(){const b=$("inspBody");const o=itemById(sel),p=st.pipes.find(q=>q.id===sel);
  if(o){const D=DEFS[o.type];const conn=st.pipes.filter(q=>(q.a&&q.a.item===o.id)||(q.b&&q.b.item===o.id)).length;
   b.innerHTML=`<p style="margin:0 0 8px;color:var(--muted)">${D.n}${D.ports.length?` · патрубков: ${D.ports.length}, подключено: ${conn}`:""}</p>
   ${D.nonum?"":`<div class="field"><label for="iN">Номер наклейки</label><input id="iN" type="number" min="1" max="99" value="${o.n}"></div>`}
   <div class="field"><label for="iL">${o.type==="text"?"Текст подписи":o.type==="value"?"Показание (например, 1,5 бар или 60 °C)":"Название на схеме"}</label><input id="iL" value="${esc(o.label)}"></div>
   ${D.nonum?"":`<div class="field"><label for="iNote">Модель, примечание</label><input id="iNote" value="${esc(o.note)}" placeholder="например, Baxi ECO Nova 24F"></div>`}
   <div class="row">${D.nonum?"":`<button class="btn" id="iRot">Повернуть (R)</button>`}<button class="btn" id="iDup">Копия</button><button class="btn warn" id="iDel">Удалить</button></div>`;
   const bind=(id,f)=>{const el=$(id);if(!el)return;el.addEventListener("focus",()=>push(),{once:true});el.oninput=()=>{f(el.value);render();renderSpec();save()}};
   bind("iN",v=>o.n=Math.max(1,parseInt(v)||1));bind("iL",v=>o.label=v);bind("iNote",v=>o.note=v);
   $("iRot")&&($("iRot").onclick=rotSel);$("iDel").onclick=delSel;$("iDup").onclick=dupSel;
  }else if(p){const nm=e=>{const it=e&&itemById(e.item);return it?(DEFS[it.type].nonum?it.label:`№${it.n} ${it.label}`):"свободный конец"};
   b.innerHTML=`<div class="field"><label for="iK">Тип трубы</label><select id="iK">${Object.entries(PIPES).map(([k,v])=>`<option value="${k}"${k===p.kind?" selected":""}>${v.n}</option>`).join("")}</select></div>
   <p style="margin:0 0 8px;font-size:13px">Откуда: <b>${esc(nm(p.a))}</b><br>Куда: <b>${esc(nm(p.b))}</b><br><span style="color:var(--muted)">Изгибов: ${Math.max(0,p.pts.length-2)}</span></p>
   <div class="row"><button class="btn" id="iAuto"${p.a&&p.b?"":" disabled title=\"Нужно, чтобы оба конца были подключены к узлам\""}>Проложить заново</button><button class="btn" id="iRev">Развернуть стрелки</button><button class="btn warn" id="iDel">Удалить</button></div>
   <p class="empty" style="margin-top:8px">Тяните квадратики, чтобы двигать изгибы, и полоски, чтобы сдвигать участки. Конец трубы можно перетащить на другой патрубок.</p>`;
   $("iK").onchange=e=>{push();p.kind=e.target.value;renderAll()};
   $("iRev").onclick=()=>{push();p.pts.reverse();[p.a,p.b]=[p.b,p.a];renderAll()};$("iDel").onclick=delSel;
   $("iAuto").onclick=()=>{const A=attPos(p.a),Z=attPos(p.b);if(!A||!Z)return;push();p.pts=route(A.pos,A.d,Z.pos,Z.d);p.auto=true;renderAll()};
  }else b.innerHTML=`<p class="empty">Щёлкните по узлу или трубе на листе, чтобы изменить номер, название, модель или ход трубы.</p><p class="empty">Клавиши: Delete — удалить, R — повернуть, стрелки — сдвинуть, Ctrl+D — копия, Ctrl+Z — отменить, Shift+щелчок — поставить несколько одинаковых узлов.</p>`}
function renderSpec(){const tb=$("spec");const list=st.items.filter(o=>!DEFS[o.type]?.nonum).sort((a,b)=>a.n-b.n);
  if(!list.length){tb.innerHTML=`<tr><td colspan="2" class="empty">Пока пусто. Добавьте узлы на лист или выберите шаблон.</td></tr>`;return}
  const dup=new Set(list.map(o=>o.n).filter((n,i,a)=>a.indexOf(n)!==i));
  tb.innerHTML=list.map(o=>`<tr><td><span class="num" ${dup.has(o.n)?'style="background:#F19A90" title="Номер повторяется"':""}>${o.n}</span></td><td><input data-id="${o.id}" data-f="label" value="${esc(o.label)}" aria-label="Название №${o.n}"><input class="sm" data-id="${o.id}" data-f="note" value="${esc(o.note)}" placeholder="модель…" aria-label="Модель №${o.n}"></td></tr>`).join("");
  tb.querySelectorAll("input").forEach(el=>{el.addEventListener("focus",()=>push(),{once:true});el.oninput=()=>{const o=itemById(el.dataset.id);o[el.dataset.f]=el.value;render();save();if(sel===o.id){const i=$(el.dataset.f==="label"?"iL":"iNote");if(i)i.value=el.value}}})}
function renderMeta(){const m=st.meta||(st.meta={});[["mObj","obj"],["mAddr","addr"],["mInst","inst"],["mPhone","phone"],["mDate","date"]].forEach(([id,k])=>{const el=$(id);if(document.activeElement!==el)el.value=m[k]||"";el.oninput=()=>{m[k]=el.value;render();save()}})}

/* ---------- кнопки ---------- */
$("mSelect").onclick=()=>setMode("select");$("mPipe").onclick=()=>setMode("pipe");
$("undo").onclick=doUndo;
$("flowBtn").setAttribute("aria-pressed",flow);
$("flowBtn").onclick=()=>{flow=!flow;$("flowBtn").setAttribute("aria-pressed",flow);try{localStorage.setItem(KEY+"-flow",flow?"1":"0")}catch(e){}render()};
$("renum").onclick=()=>{push();const list=st.items.filter(o=>!DEFS[o.type]?.nonum).sort((a,b)=>(a.y-b.y)||(a.x-b.x));list.forEach((o,i)=>o.n=i+1);renderAll();toast("Номера расставлены сверху вниз, слева направо")};
let clearArm=0;$("clear").onclick=()=>{const b=$("clear");if(Date.now()-clearArm<3000){push();st=EMPTY();sel=null;renderAll();b.textContent="Очистить лист";clearArm=0;toast("Лист очищен. «Отменить» вернёт схему.")}else{clearArm=Date.now();b.textContent="Нажмите ещё раз";setTimeout(()=>{b.textContent="Очистить лист"},3000)}};
$("zIn").onclick=()=>{zoom=Math.min(2,+(zoom+.1).toFixed(2));render()};
$("zOut").onclick=()=>{zoom=Math.max(.25,+(zoom-.1).toFixed(2));render()};
$("zFit").onclick=fit;
function fit(){const w=$("wrap").clientWidth-2;zoom=Math.max(.25,Math.min(1.2,w/W));render()}

function openModal(html){$("modalBox").innerHTML=html;$("modal").hidden=false;const c=$("mClose");if(c)c.onclick=closeModal}
function closeModal(){$("modal").hidden=true}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

$("tplBtn").onclick=()=>{
  const cards=TPL.map((t,i)=>{const s=t.build();return `<button class="tpl" data-t="${t.id}"><svg viewBox="10 10 ${DRAW_R-10} ${H-20}" xmlns="http://www.w3.org/2000/svg">${sheetSVG(s,{thumb:true})}</svg><b>${i+1}. ${esc(t.name)}</b><span>${esc(t.desc)}</span></button>`}).join("");
  openModal(`<h2 style="font-size:17px">Шаблоны котельных</h2><p style="margin:0;color:var(--muted)">Выберите похожую котельную и доработайте её под объект. Текущая схема заменится, вернуть её можно кнопкой «Отменить».</p><div class="tpl-grid">${cards}<button class="tpl" data-t="empty"><svg viewBox="0 0 1070 970"><rect width="1070" height="970" fill="#fff"/><text x="535" y="500" font-size="60" text-anchor="middle" fill="#9AA8B0" font-family="Arial">Пустой лист</text></svg><b>Пустой лист</b><span>Начать схему с нуля.</span></button></div><div class="row"><button class="btn" id="mClose">Закрыть</button></div>`);
  document.querySelectorAll(".tpl").forEach(b=>b.onclick=()=>{push();st=b.dataset.t==="empty"?EMPTY():getTpl(b.dataset.t);sel=null;draft=null;closeModal();renderAll();toast("Шаблон загружен. «Отменить» вернёт прежнюю схему.")})};

$("pngBtn").onclick=()=>{
  const src=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${sheetSVG(st,{export:true})}</svg>`;
  const img=new Image();const url=URL.createObjectURL(new Blob([src],{type:"image/svg+xml"}));
  img.onload=()=>{const c=document.createElement("canvas");c.width=W*2;c.height=H*2;const x=c.getContext("2d");x.scale(2,2);x.drawImage(img,0,0);URL.revokeObjectURL(url);
    let data;try{data=c.toDataURL("image/png")}catch(e){data=null}
    openModal(`<h2 style="font-size:17px">Картинка схемы готова</h2><p style="margin:0;color:var(--muted)">На телефоне: нажмите на картинку и удерживайте, затем «Сохранить изображение». На компьютере: правая кнопка мыши → «Сохранить картинку как…». Её можно распечатать и вклеить в паспорт котельной или отправить клиенту.</p>${data?`<img src="${data}" alt="Схема котельной">`:`<p>Не получилось собрать картинку в этом браузере. Попробуйте другой браузер.</p>`}<div class="row">${data&&!inFrame?`<a class="btn primary" download="skhema-kotelnoy.png" href="${data}">Скачать PNG</a>`:""}<button class="btn${data&&!inFrame?"":" primary"}" id="mClose">Закрыть</button></div>`)};
  img.onerror=()=>toast("Не получилось собрать картинку");img.src=url};

$("codeBtn").onclick=()=>{
  openModal(`<h2 style="font-size:17px">Код схемы</h2><p style="margin:0;color:var(--muted)">Схема хранится в этом браузере. Чтобы перенести её на другое устройство или сохранить копию, скопируйте код и отправьте себе, например в мессенджер. Чтобы открыть схему, вставьте код в поле и нажмите «Загрузить».</p><textarea id="codeTa" aria-label="Код схемы">${esc(JSON.stringify(st))}</textarea><div class="row"><button class="btn primary" id="cCopy">Скопировать</button><button class="btn" id="cLoad">Загрузить из поля</button><button class="btn" id="mClose">Закрыть</button></div><p id="cMsg" class="hint" style="margin:0"></p>`);
  $("cCopy").onclick=()=>{const ta=$("codeTa");const fb=()=>{ta.select();$("cMsg").textContent="Код выделен. Скопируйте его вручную (Ctrl+C или «Копировать»)."};try{navigator.clipboard.writeText(ta.value).then(()=>{$("cMsg").textContent="Скопировано"},fb)}catch(e){fb()}};
  $("cLoad").onclick=()=>{try{const o=JSON.parse($("codeTa").value);if(!o.items||!o.pipes)throw 0;o.pipes.forEach(p=>{if(!("a" in p))p.a=null;if(!("b" in p))p.b=null});push();st=o;sel=null;renderAll();closeModal();toast("Схема загружена")}catch(e){$("cMsg").textContent="В поле не код схемы. Вставьте код целиком, от первой { до последней }."}}};

buildLib();buildChips();hint(null);renderAll();
requestAnimationFrame(()=>{if($("wrap").clientWidth<W)fit()});
window.__k={TPL,st:()=>st,getTpl,route,portAbs};
})();
</script>
